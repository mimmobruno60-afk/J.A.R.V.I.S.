<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#02090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<title>J.A.R.V.I.S. Online</title>
<style>
:root{color-scheme:dark;--bg:#02090f;--c:#2ee6ff;--c2:#0a7f95;--w:#ffb02e;--r:#ff4d4d;--g:#3dffa0;--tx:#bff6ff;--pn:rgba(46,230,255,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;letter-spacing:.04em}
body{background:radial-gradient(circle at 50% 18%,#06303c 0,var(--bg) 62%);min-height:100vh;padding:10px 12px 14px}
h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.4em;text-align:center;color:var(--c);opacity:.9}
.core{position:relative;width:min(62vw,240px);aspect-ratio:1;margin:8px auto 4px}
.core svg{width:100%;height:100%;overflow:visible}
.r1{transform-origin:100px 100px;animation:sp 14s linear infinite}
.r2{transform-origin:100px 100px;animation:sp 9s linear infinite reverse}
.r3{transform-origin:100px 100px;animation:sp 22s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.orb{transform-origin:100px 100px;animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.12);opacity:.75}}
body[data-s=thinking] .r1{animation-duration:2.5s}body[data-s=thinking] .r2{animation-duration:1.8s}
body[data-s=speaking] .orb{animation-duration:.6s}
body[data-s=listening] .orb{animation-duration:1.1s;fill:var(--g)}
#state{text-align:center;font-size:12px;color:var(--c);letter-spacing:.3em;text-transform:uppercase;min-height:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.p{border:1px solid var(--c2);background:var(--pn);padding:7px 9px;border-radius:3px;position:relative}
.p:before{content:"";position:absolute;top:-1px;left:-1px;width:10px;height:10px;border-top:2px solid var(--c);border-left:2px solid var(--c)}
.p h2{margin:0 0 3px;font-size:10px;font-weight:600;letter-spacing:.25em;color:var(--c2);text-transform:uppercase}
.v{font-size:21px;font-weight:600;color:var(--c)}
.s{font-size:11px;opacity:.75;line-height:1.35}
.bar{height:5px;background:#0a2a33;margin-top:4px}.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .6s}
.warn .v,.warn{color:var(--w)}.bad .v,.bad{color:var(--r)}
.full{grid-column:1/-1}
#log{max-height:84px;overflow-y:auto;font-size:12px;line-height:1.5}
#chat{border:1px solid var(--c2);background:var(--pn);border-radius:3px;padding:8px;height:200px;overflow-y:auto;font-size:15px;line-height:1.4}
.m{margin:0 0 7px;white-space:pre-wrap}.m b{color:var(--c);letter-spacing:.15em;font-size:11px;display:block}.m.u b{color:var(--g)}
.row{display:flex;gap:6px;margin-top:8px}
input{flex:1;min-width:0;background:#031820;border:1px solid var(--c2);color:var(--tx);padding:10px;font:inherit;font-size:16px;border-radius:3px;outline:none}
input:focus{border-color:var(--c)}
button{background:transparent;border:1px solid var(--c);color:var(--c);padding:0 12px;font:inherit;border-radius:3px;cursor:pointer;letter-spacing:.1em}
button:active,button.on{background:var(--c);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{font-size:12px;padding:4px 8px;opacity:.85}
</style>
</head>
<body data-s="idle">
<h1>J.A.R.V.I.S.</h1>
<div class="core">
<svg viewBox="0 0 200 200" fill="none" stroke="var(--c)">
<circle cx="100" cy="100" r="96" stroke-opacity=".25"/>
<g class="r1"><circle cx="100" cy="100" r="88" stroke-width="3" stroke-dasharray="40 14 8 14"/></g>
<g class="r2"><circle cx="100" cy="100" r="74" stroke-width="2" stroke-dasharray="4 8"/></g>
<g class="r3"><circle cx="100" cy="100" r="60" stroke-width="5" stroke-opacity=".5" stroke-dasharray="90 30"/></g>
<circle cx="100" cy="100" r="44" stroke-opacity=".6"/>
<circle class="orb" cx="100" cy="100" r="30" fill="var(--c)" fill-opacity=".25" stroke-width="2"/>
<circle cx="100" cy="100" r="12" fill="var(--c)" stroke="none"/>
</svg></div>
<div id="state">in attesa</div>

<div class="grid">
<div class="p" id="pb"><h2>Batteria</h2><div class="v" id="bv">--</div><div class="s" id="bs">lettura…</div><div class="bar"><i id="bb"></i></div></div>
<div class="p" id="pn"><h2>Rete</h2><div class="v" id="nv">--</div><div class="s" id="ns">lettura…</div></div>
<div class="p"><h2>Sistema</h2><div class="v" id="cv">--</div><div class="s" id="cs"></div></div>
<div class="p"><h2>Ora</h2><div class="v" id="tv">--</div><div class="s" id="ts"></div></div>
<div class="p full"><h2>Avvisi</h2><div id="log" class="s">Nessuna anomalia.</div></div>
</div>

<div id="chat"><div class="m"><b>JARVIS</b>Buongiorno. Sono operativo. Chiedimi qualsiasi cosa o chiedi lo stato del dispositivo.</div></div>
<div class="chips">
<button data-q="Fammi un rapporto completo sullo stato del dispositivo">Rapporto</button>
<button data-q="Come sta la batteria?">Batteria</button>
<button data-q="Com’è la connessione di rete?">Rete</button>
</div>
<div class="row">
<input id="in" placeholder="Parla con Jarvis…" autocomplete="off">
<button id="mic" title="Dettatura">🎤</button>
<button id="vo" class="on" title="Voce">🔊</button>
<button id="cfg" title="Impostazioni">⚙</button><button id="go">▶</button>
</div>

<script>
const $=id=>document.getElementById(id);
const T={bat:null,online:navigator.onLine,storage:null};
const alerts=new Set();
function warn(key,msg){if(alerts.has(key))return;alerts.add(key);const l=$('log');if(l.dataset.e!=='1'){l.textContent='';l.dataset.e='1'}
 const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString('it-IT')+' · '+msg;d.style.color='var(--w)';l.prepend(d);if(vOn)say('Attenzione. '+msg)}
function clear(key){alerts.delete(key)}
let vOn=true;

// --- telemetria ---
async function initBat(){try{const b=await navigator.getBattery();T.bat=b;['levelchange','chargingchange'].forEach(e=>b.addEventListener(e,upd));upd()}catch(e){$('bs').textContent='Dato non disponibile su questo browser'}}
function conn(){return navigator.connection||{}}
function upd(){
 const b=T.bat;
 if(b){const p=Math.round(b.level*100);$('bv').textContent=p+'%';$('bb').style.width=p+'%';
  $('bs').textContent=b.charging?'In carica':'In uso a batteria';
  $('pb').className='p'+(p<=10&&!b.charging?' bad':p<=20&&!b.charging?' warn':'');
  if(p<=20&&!b.charging)warn('bat','Batteria al '+p+'%. Collegare il caricatore.');else clear('bat')}
 const c=conn();T.online=navigator.onLine;
 $('nv').textContent=T.online?(c.effectiveType||'online').toUpperCase():'OFFLINE';
 $('ns').textContent=T.online?[c.downlink?c.downlink+' Mb/s':'',c.rtt?c.rtt+' ms':'',c.saveData?'risparmio dati':''].filter(Boolean).join(' · ')||'connesso':'Nessuna connessione';
 $('pn').className='p'+(!T.online?' bad':(c.effectiveType==='2g'||c.effectiveType==='slow-2g')?' warn':'');
 if(!T.online)warn('net','Connessione assente.');else clear('net');
 if(T.online&&(c.effectiveType==='2g'||c.effectiveType==='slow-2g'))warn('slow','Rete molto lenta.');else clear('slow');
 $('cv').textContent=(navigator.hardwareConcurrency||'?')+' core';
 $('cs').textContent=(navigator.deviceMemory?'RAM ~'+navigator.deviceMemory+' GB · ':'')+screen.width+'×'+screen.height+' · '+((screen.orientation&&screen.orientation.type)||'').split('-')[0]+(T.storage?' · archivio '+T.storage:'');
}
function clock(){const d=new Date();$('tv').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});$('ts').textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}
async function stor(){try{const e=await navigator.storage.estimate();T.storage=Math.round(e.usage/1048576)+'/'+Math.round(e.quota/1048576)+' MB';upd();
 if(e.quota&&e.usage/e.quota>.9)warn('sto','Archivio del browser quasi pieno.')}catch(e){}}
function snap(){const b=T.bat,c=conn();return JSON.stringify({batteria:b?{percentuale:Math.round(b.level*100),in_carica:b.charging,minuti_a_scarica:isFinite(b.dischargingTime)?Math.round(b.dischargingTime/60):null,minuti_a_carica:isFinite(b.chargingTime)?Math.round(b.chargingTime/60):null}:'non disponibile',rete:{online:navigator.onLine,tipo:c.effectiveType||null,downlink_mbps:c.downlink||null,rtt_ms:c.rtt||null,risparmio_dati:c.saveData||false},sistema:{core:navigator.hardwareConcurrency||null,ram_gb:navigator.deviceMemory||null,schermo:screen.width+'x'+screen.height,orientamento:screen.orientation?screen.orientation.type:null,archivio:T.storage,lingua:navigator.language,ora_locale:new Date().toString()},avvisi_attivi:[...alerts]})}
window.addEventListener('online',upd);window.addEventListener('offline',upd);
if(navigator.connection)navigator.connection.addEventListener('change',upd);
initBat();stor();upd();clock();setInterval(clock,10000);setInterval(()=>{upd();stor()},15000);

// --- voce ---
function say(t){try{if(!vOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*#_`]/g,''));u.lang='it-IT';u.rate=1.02;u.onstart=()=>setS('speaking','sto parlando');u.onend=()=>setS('idle','in attesa');speechSynthesis.speak(u)}catch(e){}}
function setS(s,t){document.body.dataset.s=s;$('state').textContent=t}
$('vo').onclick=e=>{vOn=!vOn;e.currentTarget.classList.toggle('on',vOn);if(!vOn&&window.speechSynthesis)speechSynthesis.cancel()};

// --- motore Gemini con ricerca web ---
function gkey(){try{return localStorage.getItem('jv_key')||''}catch(e){return''}}
function gmodel(){try{return localStorage.getItem('jv_model')||'gemini-3.8-flash'}catch(e){return'gemini-3.8-flash'}}
$('cfg').onclick=()=>{const k=prompt('Chiave API Gemini (resta solo su questo dispositivo):',gkey());if(k===null)return;
 const m=prompt('Modello Gemini:',gmodel());try{localStorage.setItem('jv_key',k.trim());if(m)localStorage.setItem('jv_model',m.trim())}catch(e){}add('JARVIS','Configurazione aggiornata, signore.')};
async function engine(msgs,out){
 if(!gkey())throw new Error('chiave mancante');
 out.textContent='…';
 const body={contents:msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),tools:[{google_search:{}}]};
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(gmodel())+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':gkey()},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
 const c=j.candidates&&j.candidates[0];const text=((c&&c.content&&c.content.parts)||[]).map(p=>p.text||'').join('').trim()||'Nessuna risposta, signore.';
 out.textContent=text;return{text}}
// --- chat ---
const hist=[];let busy=false,sample=null;
const SYS='Sei J.A.R.V.I.S., il maggiordomo IA di Tony Stark: educato, sottile ironia britannica, estremamente competente, risposte brevi e chiare (massimo 4 frasi salvo richiesta contraria), in italiano. Chiami l’utente "signore" o "signora" con parsimonia. Rispondi a qualsiasi domanda. Per notizie, meteo, sport, prezzi, orari e qualsiasi fatto recente usa la ricerca web di Google e cita in poche parole la fonte. Quando l’utente chiede dello stato del dispositivo usa SOLO la telemetria reale fornita qui sotto, segnala anomalie e dichiara onestamente ciò che il browser non può misurare (CPU, temperatura, app aperte). Non inventare mai dati. Niente markdown.';
function add(who,txt){const d=document.createElement('div');d.className='m '+(who==='TU'?'u':'');const b=document.createElement('b');b.textContent=who;const s=document.createElement('span');s.textContent=txt;d.append(b,s);$('chat').append(d);$('chat').scrollTop=1e9;return s}
(async()=>{try{sample=await claude.use('sample')}catch(e){}})();
async function send(q){
 q=(q||$('in').value).trim();if(!q||busy)return;$('in').value='';
 add('TU',q);
 if(!sample&&!gkey()){add('JARVIS','Signore, manca la chiave Gemini. Tocchi ⚙ per inserirla.');return}
 busy=true;setS('thinking','elaboro');const out=add('JARVIS','');
 const msgs=hist.slice(-8).concat([{role:'user',content:SYS+'\n\nTELEMETRIA ATTUALE DEL DISPOSITIVO (JSON):\n'+snap()+'\n\nRICHIESTA: '+q}]);
 try{const r=await engine(msgs,out);
  out.textContent=r.text;hist.push({role:'user',content:q},{role:'assistant',content:r.text});say(r.text);if(!vOn)setS('idle','in attesa')}
 catch(e){out.textContent='Errore di comunicazione: '+((e&&e.message)||'sconosciuto').slice(0,160);setS('idle','in attesa')}
 busy=false}
$('go').onclick=()=>send();$('in').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>send(b.dataset.q));

// --- dettatura ---
(async()=>{let d=null;try{d=await claude.use('dictation')}catch(e){}
 if(!d){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('mic').style.display='none';return}
 $('mic').onclick=()=>{const r=new R();r.lang='it-IT';r.interimResults=true;setS('listening','ti ascolto');$('mic').classList.add('on');r.onresult=e=>{const t=[...e.results].map(x=>x[0].transcript).join('');$('in').value=t;if(e.results[e.results.length-1].isFinal)send()};r.onend=()=>{$('mic').classList.remove('on');if(!busy)setS('idle','in attesa')};r.start()};return}
 d.onPartial(({text})=>{$('in').value=text});d.onFinal(({text})=>{$('in').value=text;send()});
 d.onState(({state})=>{if(state==='listening')setS('listening','ti ascolto');else if(!busy&&document.body.dataset.s==='listening')setS('idle','in attesa');$('mic').classList.toggle('on',state==='listening')});
 $('mic').onclick=()=>{d.start().catch(()=>{})}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
